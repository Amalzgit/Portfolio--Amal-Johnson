<section class="py-12 relative">
  <div class="max-w-7xl mx-auto">
    
    <!-- Section Header Tag -->
    <div class="flex items-center gap-4 mb-10">
      <div class="spatial-pill bg-indigo-500/10 border-indigo-400/30 text-indigo-400 font-outfit font-bold">
        02. TECHNICAL ARSENAL
      </div>
      <h2 class="text-3xl sm:text-5xl font-outfit font-extrabold text-white tracking-tight">
        SKILLS & <span class="bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">CAPABILITIES</span>
      </h2>
      <div class="h-px bg-white/10 flex-grow hidden sm:block"></div>
    </div>

    <!-- Skills Spatial Grid -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let skill of skills" 
           class="spatial-glass-card p-5 group">
        
        <div class="flex justify-between items-center mb-3">
          <h3 class="text-base font-outfit font-bold text-white group-hover:text-sky-300 transition-colors">
            {{ skill.name }}
          </h3>
          
          <span class="spatial-pill py-0.5 text-[10px] uppercase font-bold border-white/20">
            {{ skill.category }}
          </span>
        </div>
        
        <!-- Spatial Glass Progress Meter -->
        <div class="w-full bg-white/5 border border-white/10 p-0.5 rounded-full shadow-inner overflow-hidden">
          <div class="h-2 rounded-full bg-gradient-to-r from-sky-400 via-cyan-300 to-indigo-400 transition-all duration-1000 ease-out shadow-glow-cyan"
               [style.width]="skill.level + '%'">
          </div>
        </div>
        
        <div class="flex justify-between items-center mt-2.5 font-sans">
          <span class="text-[10px] font-semibold text-slate-400 uppercase tracking-widest">Proficiency</span>
          <span class="text-xs font-bold text-sky-400">
            {{ skill.level }}%
          </span>
        </div>

      </div>
    </div>

  </div>
</section>
