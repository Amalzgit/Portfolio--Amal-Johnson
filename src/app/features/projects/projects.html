<section class="py-12 relative">
  <div class="max-w-7xl mx-auto">
    
    <!-- Section Header Tag -->
    <div class="flex items-center gap-4 mb-12">
      <div class="spatial-pill bg-sky-500/10 border-sky-400/30 text-sky-300 font-outfit font-bold">
        04. FEATURED WORK
      </div>
      <h2 class="text-3xl sm:text-5xl font-outfit font-extrabold text-white tracking-tight">
        PROJECTS & <span class="bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">BUILD LAB</span>
      </h2>
      <div class="h-px bg-white/10 flex-grow hidden sm:block"></div>
    </div>

    <!-- Spatial Project Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <div *ngFor="let project of projects; let idx = index" 
           class="spatial-glass-card p-6 sm:p-8 flex flex-col justify-between border-white/15 hover:border-sky-400/50 group">
        
        <div>
          <!-- Card Header & Badges -->
          <div class="flex justify-between items-start gap-4 mb-4">
            <div class="spatial-pill bg-white/5 text-sky-400 border-white/15 text-xs font-outfit font-extrabold">
              PROJECT 0{{ idx + 1 }}
            </div>
            
            <div class="flex items-center gap-2">
              @if (project.githubLink) {
                <a [href]="project.githubLink" target="_blank" 
                   class="p-2 rounded-full bg-white/5 border border-white/15 text-slate-300 hover:text-white hover:border-sky-400/50 transition-colors flex items-center gap-1.5"
                   aria-label="GitHub Repository">
                  <ng-icon name="lucideGithub" size="16"></ng-icon>
                </a>
              }
              @if (project.liveLink) {
                <a [href]="project.liveLink" target="_blank" 
                   class="p-2 rounded-full bg-sky-500/20 border border-sky-400/30 text-sky-300 hover:bg-sky-500 hover:text-black transition-all flex items-center gap-1.5"
                   aria-label="Live Demo">
                  <ng-icon name="lucideExternalLink" size="16"></ng-icon>
                </a>
              }
            </div>
          </div>

          <!-- Project Title -->
          <h3 class="text-2xl font-outfit font-extrabold text-white group-hover:text-sky-300 transition-colors mb-3">
            {{ project.title }}
          </h3>

          <!-- Description -->
          <p class="font-sans text-slate-300 text-sm sm:text-base leading-relaxed mb-6">
            {{ project.description }}
          </p>
        </div>

        <!-- Tech Stack Badges -->
        <div class="pt-4 border-t border-white/10 flex flex-wrap gap-2">
          <span *ngFor="let tech of project.techStack" 
                class="spatial-pill py-0.5 text-[11px] font-sans font-medium text-slate-300">
            {{ tech }}
          </span>
        </div>

      </div>

    </div>

  </div>
</section>
