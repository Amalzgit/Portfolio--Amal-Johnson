<section class="py-12 relative">
  <div class="max-w-7xl mx-auto">
    
    <!-- Section Header -->
    <div class="flex items-center gap-4 mb-12">
      <div class="bg-[#f43f5e] text-white font-space font-extrabold text-sm uppercase px-4 py-1.5 border-3 border-black shadow-[4px_4px_0px_#000] transform rotate-1">
        04. FEATURED WORK
      </div>
      <h2 class="text-3xl sm:text-5xl font-syne font-extrabold text-white tracking-tight">
        PROJECTS & <span class="text-[#06b6d4]">BUILD LAB</span>
      </h2>
      <div class="h-1 bg-black flex-grow border-b-2 border-dashed border-[#f43f5e] hidden sm:block"></div>
    </div>

    <!-- Project Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      
      <div *ngFor="let project of projects; let idx = index" 
           class="bg-[#130c21] border-3 border-black p-6 sm:p-8 flex flex-col justify-between transition-all duration-300 hover:-translate-x-1.5 hover:-translate-y-1.5 group"
           [ngClass]="idx % 2 === 0 ? 'shadow-brutal-lime hover:shadow-brutal-pink' : 'shadow-brutal-cyan hover:shadow-brutal-yellow'">
        
        <div>
          <!-- Card Header & Badges -->
          <div class="flex justify-between items-start gap-4 mb-4">
            <div class="bg-[#a3e635] text-black font-space font-extrabold text-xs px-2.5 py-1 border-2 border-black shadow-[2px_2px_0px_#000]">
              PROJECT 0{{ idx + 1 }}
            </div>
            
            <div class="flex items-center gap-2">
              @if (project.githubLink) {
                <a [href]="project.githubLink" target="_blank" 
                   class="px-3 py-1 bg-[#f43f5e] text-white font-space font-bold text-xs border-2 border-black shadow-[2px_2px_0px_#000] hover:-translate-y-0.5 transition-transform flex items-center gap-1.5">
                  <ng-icon name="lucideGithub" size="14"></ng-icon>
                  <span>CODE</span>
                </a>
              }
              @if (project.liveLink) {
                <a [href]="project.liveLink" target="_blank" 
                   class="px-3 py-1 bg-[#06b6d4] text-black font-space font-bold text-xs border-2 border-black shadow-[2px_2px_0px_#000] hover:-translate-y-0.5 transition-transform flex items-center gap-1.5">
                  <ng-icon name="lucideExternalLink" size="14"></ng-icon>
                  <span>DEMO</span>
                </a>
              }
            </div>
          </div>

          <!-- Project Title -->
          <h3 class="text-2xl font-syne font-extrabold text-white group-hover:text-[#a3e635] transition-colors mb-3">
            {{ project.title }}
          </h3>

          <!-- Description -->
          <p class="font-space text-slate-300 text-sm sm:text-base leading-relaxed mb-6">
            {{ project.description }}
          </p>
        </div>

        <!-- Tech Stack Badges -->
        <div class="pt-4 border-t-2 border-black flex flex-wrap gap-2">
          <span *ngFor="let tech of project.techStack" 
                class="px-2.5 py-0.5 bg-[#1d1233] text-[#a3e635] font-space font-bold text-xs border border-black shadow-[2px_2px_0px_#000]">
            # {{ tech }}
          </span>
        </div>

      </div>

    </div>

  </div>
</section>
