<section class="py-12 relative">
  <div class="max-w-5xl mx-auto">
    
    <!-- Section Header Tag -->
    <div class="flex items-center gap-4 mb-12">
      <div class="spatial-pill bg-purple-500/10 border-purple-400/30 text-purple-300 font-outfit font-bold">
        03. CAREER JOURNEY
      </div>
      <h2 class="text-3xl sm:text-5xl font-outfit font-extrabold text-white tracking-tight">
        WORK <span class="bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">EXPERIENCE</span>
      </h2>
      <div class="h-px bg-white/10 flex-grow hidden sm:block"></div>
    </div>

    <!-- Spatial Floating Cards -->
    <div class="space-y-8 relative">
      
      <div *ngFor="let exp of experiences; let i = index" class="spatial-glass-card p-6 sm:p-8 relative group border-white/15">
        
        <!-- Header Row -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-white/10 pb-4 mb-4">
          <div>
            <div class="spatial-pill bg-sky-500/20 text-sky-300 border-sky-400/30 text-[10px] uppercase font-bold mb-2">
              📍 {{ exp.location }}
            </div>
            <h3 class="text-2xl font-outfit font-extrabold text-white">{{ exp.role }}</h3>
            <div class="text-sky-400 font-sans font-semibold text-base mt-0.5">
              ✦ {{ exp.company }}
            </div>
          </div>

          <div class="spatial-pill bg-indigo-500/20 text-indigo-300 border-indigo-400/30 text-xs font-bold w-max">
            📅 {{ exp.duration }}
          </div>
        </div>

        <!-- Achievements -->
        <ul class="space-y-3 font-sans text-slate-300 text-sm sm:text-base leading-relaxed">
          <li *ngFor="let achievement of exp.achievements" class="flex items-start gap-3">
            <span class="w-4 h-4 rounded-full bg-sky-400/20 text-sky-400 font-bold text-[10px] flex items-center justify-center border border-sky-400/30 shrink-0 mt-1">
              ✓
            </span>
            <span>{{ achievement }}</span>
          </li>
        </ul>

      </div>

    </div>

  </div>
</section>
