<section class="py-12 relative">
  <div class="max-w-5xl mx-auto">
    
    <!-- Section Header -->
    <div class="flex items-center gap-4 mb-12">
      <div class="bg-[#fbbf24] text-black font-space font-extrabold text-sm uppercase px-4 py-1.5 border-3 border-black shadow-[4px_4px_0px_#000] transform -rotate-1">
        03. CAREER JOURNEY
      </div>
      <h2 class="text-3xl sm:text-5xl font-syne font-extrabold text-white tracking-tight">
        WORK <span class="text-[#f43f5e]">EXPERIENCE</span>
      </h2>
      <div class="h-1 bg-black flex-grow border-b-2 border-dashed border-[#fbbf24] hidden sm:block"></div>
    </div>

    <!-- Timeline Wrapper -->
    <div class="space-y-8 relative">
      
      <div *ngFor="let exp of experiences; let i = index" class="relative group">
        
        <div class="bg-[#130c21] p-6 sm:p-8 border-3 border-black shadow-brutal transition-all duration-300 hover:-translate-x-1 hover:-translate-y-1 hover:shadow-brutal-lime">
          
          <!-- Top Row: Role, Company & Date Badge -->
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b-2 border-black pb-4 mb-4">
            <div>
              <div class="inline-block bg-[#f43f5e] text-white px-2.5 py-0.5 text-xs font-space font-extrabold uppercase border border-black shadow-[2px_2px_0px_#000] mb-2">
                {{ exp.location }}
              </div>
              <h3 class="text-2xl font-syne font-extrabold text-white">{{ exp.role }}</h3>
              <div class="text-[#a3e635] font-space font-bold text-base sm:text-lg mt-0.5">
                ⚡ {{ exp.company }}
              </div>
            </div>

            <div class="bg-[#a3e635] text-black px-4 py-2 font-space font-extrabold text-xs sm:text-sm border-2 border-black shadow-[3px_3px_0px_#000] w-max">
              📅 {{ exp.duration }}
            </div>
          </div>

          <!-- Achievements List -->
          <ul class="space-y-3 font-space text-slate-300 text-sm sm:text-base leading-relaxed">
            <li *ngFor="let achievement of exp.achievements" class="flex items-start gap-3">
              <span class="w-5 h-5 bg-[#06b6d4] text-black font-extrabold text-xs flex items-center justify-center border border-black shrink-0 mt-0.5">
                ✓
              </span>
              <span>{{ achievement }}</span>
            </li>
          </ul>

        </div>

      </div>

    </div>

  </div>
</section>
