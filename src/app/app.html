<div class="relative bg-[#050711] min-h-screen text-slate-100 font-sans selection:bg-[#38bdf8] selection:text-black overflow-x-hidden">
  
  <!-- Spatial Ambient Glowing Orbs Background -->
  <div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">
    <!-- Top Center Cyan Glow -->
    <div class="spatial-glow-orb top-[-10%] left-[20%] w-[600px] h-[600px] bg-sky-500/20"></div>
    <!-- Middle Right Indigo Glow -->
    <div class="spatial-glow-orb top-[35%] right-[-10%] w-[700px] h-[700px] bg-indigo-600/15" style="animation-delay: 2s;"></div>
    <!-- Bottom Left Violet Glow -->
    <div class="spatial-glow-orb bottom-[-10%] left-[-10%] w-[650px] h-[650px] bg-purple-600/15" style="animation-delay: 4s;"></div>
  </div>

  <!-- Main Content Wrapper -->
  <div class="relative z-10 flex flex-col min-h-screen">
    
    <!-- Floating Curved Spatial Glass Header -->
    <app-header class="sticky top-4 z-50 transition-all duration-300 max-w-6xl mx-auto w-full px-4 sm:px-6"></app-header>
    
    <router-outlet></router-outlet>
    
    <!-- Portfolio Sections Stacked in 3D Space -->
    <main class="flex-grow flex flex-col w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-24 sm:space-y-36 py-12">
      <app-hero id="hero"></app-hero>
      <app-about id="about"></app-about>
      <app-skills id="skills"></app-skills>
      <app-experience id="experience"></app-experience>
      <app-projects id="projects"></app-projects>
      <app-case-studies id="case-studies"></app-case-studies>
      <app-contact id="contact"></app-contact>
    </main>

    <!-- Floating Glass Footer -->
    <app-footer></app-footer>
  </div>
</div>
