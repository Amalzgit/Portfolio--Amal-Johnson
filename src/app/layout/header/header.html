<header class="w-full">
  <div class="bg-slate-900/60 backdrop-blur-2xl border border-white/15 rounded-full px-5 py-3 shadow-spatial transition-all duration-300">
    <div class="flex justify-between items-center">
      
      <!-- Spatial Logo -->
      <a href="#" class="group flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-sky-400 to-indigo-500 text-slate-950 font-outfit font-black text-sm flex items-center justify-center shadow-glow-cyan">
          AJ
        </div>
        <span class="text-lg font-outfit font-extrabold tracking-tight text-white group-hover:text-sky-400 transition-colors">
          AMAL<span class="text-sky-400">.</span>DEV
        </span>
      </a>

      <!-- Floating Glass Navigation Links -->
      <nav class="hidden md:flex space-x-2 items-center">
        <a href="#about" class="px-4 py-1.5 font-sans text-xs font-semibold text-slate-300 hover:text-white rounded-full hover:bg-white/10 transition-all">About</a>
        <a href="#skills" class="px-4 py-1.5 font-sans text-xs font-semibold text-slate-300 hover:text-white rounded-full hover:bg-white/10 transition-all">Skills</a>
        <a href="#experience" class="px-4 py-1.5 font-sans text-xs font-semibold text-slate-300 hover:text-white rounded-full hover:bg-white/10 transition-all">Experience</a>
        <a href="#projects" class="px-4 py-1.5 font-sans text-xs font-semibold text-slate-300 hover:text-white rounded-full hover:bg-white/10 transition-all">Projects</a>
        <a href="#case-studies" class="px-4 py-1.5 font-sans text-xs font-semibold text-slate-300 hover:text-white rounded-full hover:bg-white/10 transition-all">Case Study</a>
        
        <a href="#contact" class="spatial-btn-primary ml-2 py-2 px-5 text-xs">
          CONNECT ✦
        </a>
      </nav>

      <!-- Mobile Menu Button -->
      <button 
        class="md:hidden p-2 rounded-full bg-white/10 text-white border border-white/20 active:scale-95" 
        (click)="toggleMenu()"
        aria-label="Toggle menu">
        <ng-icon [name]="isMenuOpen() ? 'lucideX' : 'lucideMenu'" size="20"></ng-icon>
      </button>
    </div>
  </div>

  <!-- Mobile Navigation Dropdown -->
  <div 
    class="md:hidden mt-2 bg-slate-900/90 border border-white/15 backdrop-blur-2xl rounded-2xl transition-all duration-300 overflow-hidden"
    [ngClass]="isMenuOpen() ? 'max-h-[400px] opacity-100 p-5 shadow-spatial' : 'max-h-0 opacity-0 p-0 border-0'">
    <div class="flex flex-col space-y-2.5 font-sans">
      <a href="#about" (click)="toggleMenu()" class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 font-medium text-sm text-slate-200">About</a>
      <a href="#skills" (click)="toggleMenu()" class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 font-medium text-sm text-slate-200">Skills</a>
      <a href="#experience" (click)="toggleMenu()" class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 font-medium text-sm text-slate-200">Experience</a>
      <a href="#projects" (click)="toggleMenu()" class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 font-medium text-sm text-slate-200">Projects</a>
      <a href="#case-studies" (click)="toggleMenu()" class="px-4 py-2.5 rounded-xl bg-white/5 border border-white/10 font-medium text-sm text-slate-200">Case Studies</a>
      <a href="#contact" (click)="toggleMenu()" class="spatial-btn-primary w-full text-center mt-2 py-3">
        CONNECT ✦
      </a>
    </div>
  </div>
</header>
